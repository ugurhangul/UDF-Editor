name: udf_editor
description: "UDFtör — Create, edit, and sign UYAP .udf files on mobile."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Phase 1: UDF Reader
  archive: ^4.0.4              # ZIP extraction/creation
  xml: ^6.5.0                  # XML parsing
  path_provider: ^2.1.0        # App document directory
  file_picker: ^8.0.0          # SAF / UIDocumentPicker
  go_router: ^14.0.0           # Declarative routing
  flutter_riverpod: ^2.5.0     # State management
  share_plus: 11.0.0           # Share files
  google_mobile_ads: ^5.1.0    # AdMob banner ads
  flutter_secure_storage: ^9.2.0 # Secure key storage

  # Phase 2: UDF Editor
  flutter_quill: ^11.0.0         # WYSIWYG rich text editor
  purchases_flutter: ^8.0.0     # RevenueCat paywall
  nfc_manager: 4.1.0
  pointycastle: 3.9.1
  asn1lib: 1.5.8
  basic_utils: 5.7.0
  http: 1.3.0
  pkcs7: 1.0.4

  # Phase 4: Cloud Sync
  google_sign_in: ^6.2.0
  googleapis: ^14.0.0
  icloud_storage: ^2.0.0
  crypto: ^3.0.0
  path: ^1.9.0
  purchases_ui_flutter: ^8.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
